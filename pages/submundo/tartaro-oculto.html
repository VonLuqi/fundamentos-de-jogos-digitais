<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d0d11" />
  <title>Os Portões do Tártaro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/submundo.css" />
</head>
<body class="submundo submundo--tartaro">
  <main class="submundo__shell">
    <p class="submundo__eyebrow">Abismo das Sombras</p>
    <h1 class="submundo__title">Os Portões do Tártaro</h1>
    <p class="submundo__greek" aria-hidden="true">ΚΑΤΑΒΑΣΙΣ · ΤΑΡΤΑΡΟΣ</p>
    <p class="submundo__riddle">
      A luz nas sombras não reside no que os olhos veem, mas nas variáveis invisíveis que moldam o Caos.
    </p>
    <p class="hidden-rune" aria-hidden="true">CERBERUS-UNBOUND</p>
    <form class="submundo__panel" id="tartaro-form">
      <label class="submundo__label" for="tartaro-pass">Palavra de passagem</label>
      <input class="submundo__input" id="tartaro-pass" name="pass" autocomplete="off" spellcheck="false" />
      <button class="submundo__btn" type="submit">Atravesar os Portões</button>
      <p class="submundo__status" id="tartaro-status" role="status"></p>
    </form>
  </main>
  <script type="module" src="../../js/submundo/tartaro.js"></script>
</body>
</html>
