<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#061018" />
  <title>As Águas Cegas do Rio Estige</title>
  <link rel="icon" href="../../assets/icons/favicon.png" type="image/png" sizes="64x64" />
  <link rel="icon" href="../../assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="../../assets/icons/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" sizes="180x180" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/submundo.css" />
</head>
<body class="submundo submundo--estige">
  <main class="submundo__shell">
    <p class="submundo__eyebrow">Juramento Sagrado</p>
    <h1 class="submundo__title">As Águas Cegas do Rio Estige</h1>
    <p class="submundo__boat" aria-hidden="true">⛵</p>
    <p class="submundo__riddle">
      Para cruzar o rio sem retorno, o barqueiro não aceita moedas comuns. O tributo nasce no terminal — um óbolo que não se conta, se reduz.
    </p>
    <div class="submundo__panel">
      <form id="estige-form">
        <label class="submundo__label" for="estige-obolo">Óbolo de Ouro (hash hex)</label>
        <input class="submundo__input" id="estige-obolo" autocomplete="off" spellcheck="false" />
        <button class="submundo__btn" type="submit">Pagar o tributo</button>
        <p class="submundo__status" id="estige-status" role="status"></p>
      </form>
    </div>
  </main>

  <div
    class="submundo__celebrate"
    id="estige-celebrate"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="estige-celebrate-title"
    aria-describedby="estige-celebrate-desc"
  >
    <div class="submundo__celebrate-flash" aria-hidden="true"></div>
    <div class="submundo__celebrate-veil" aria-hidden="true"></div>
    <div class="submundo__celebrate-rays" aria-hidden="true"></div>
    <div class="submundo__celebrate-embers" id="estige-embers" aria-hidden="true"></div>
    <div class="submundo__celebrate-shock" aria-hidden="true"></div>

    <div class="submundo__celebrate-card" id="estige-celebrate-card">
      <div class="submundo__celebrate-halo" aria-hidden="true"></div>
      <p class="submundo__celebrate-kicker">Relíquia Única</p>
      <p class="submundo__eyebrow">Travessia concluída</p>
      <p class="submundo__celebrate-crown" aria-hidden="true">👑</p>
      <h2 class="submundo__title submundo__celebrate-title" id="estige-celebrate-title">Soberano do Submundo</h2>
      <p class="submundo__celebrate-xp" id="estige-celebrate-xp" hidden></p>
      <p class="submundo__riddle" id="estige-celebrate-desc"></p>
      <button class="submundo__btn submundo__celebrate-btn" type="button" id="estige-celebrate-close">
        Retornar ao Domínio
      </button>
    </div>
  </div>

  <audio
    id="estige-aura"
    preload="auto"
    src="../../assets/submundo/soberano_aura.mp3"
    hidden
  ></audio>

  <script type="module" src="../../js/submundo/estige.js"></script>
</body>
</html>
