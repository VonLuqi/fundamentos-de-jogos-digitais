<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#101218" />
  <title>Os Campos de Asfódelos</title>
  <link rel="icon" href="../../assets/icons/favicon.png" type="image/png" sizes="64x64" />
  <link rel="icon" href="../../assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="../../assets/icons/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" sizes="180x180" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/submundo.css" />
</head>
<body class="submundo submundo--asfodelos">
  <div class="submundo__fog" aria-hidden="true"></div>
  <main class="submundo__shell">
    <p class="submundo__eyebrow">Nevoeiro dos Ecos</p>
    <h1 class="submundo__title">Os Campos de Asfódelos</h1>
    <p class="submundo__riddle">
      Nem todo som é feito para ser ouvido; algumas verdades só se revelam quando você decide olhar para a frequência do invisível.
    </p>
    <div class="submundo__panel">
      <p class="submundo__label">Eco dos campos</p>
      <audio class="submundo__audio" controls preload="metadata" src="../../assets/submundo/asfodelos_echo.wav">
        Seu navegador não reproduz áudio HTML5.
      </audio>
      <form id="asfodelos-form">
        <label class="submundo__label" for="asfodelos-pass">Chave do espectro</label>
        <input class="submundo__input" id="asfodelos-pass" autocomplete="off" spellcheck="false" />
        <button class="submundo__btn" type="submit">Seguir o eco</button>
        <p class="submundo__status" id="asfodelos-status" role="status"></p>
      </form>
    </div>
  </main>
  <script type="module" src="../../js/submundo/asfodelos.js"></script>
</body>
</html>
