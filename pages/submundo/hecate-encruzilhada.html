<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#12081a" />
  <title>A Encruzilhada de Hécate</title>
  <link rel="icon" href="../../assets/icons/favicon.png" type="image/png" sizes="64x64" />
  <link rel="icon" href="../../assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="../../assets/icons/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" sizes="180x180" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/submundo.css" />
</head>
<body class="submundo submundo--hecate">
  <main class="submundo__shell">
    <p class="submundo__eyebrow">Segredo da Relíquia Oculta</p>
    <h1 class="submundo__title">A Encruzilhada de Hécate</h1>
    <p class="submundo__riddle">
      As aparências enganam a vista superficial. Examine as entranhas digitais da imagem: primeiro o que a criação gravou nas margens, depois as camadas que a tocha esconde no pigmento mais fraco.
    </p>
    <figure class="submundo__relic">
      <img
        class="submundo__relic-img"
        src="../../assets/submundo/hecate_relic.png"
        alt="Relíquia nebulosa de Hécate — três vias sob névoa"
        width="256"
        height="256"
      />
      <figcaption class="submundo__relic-cap">Relíquia da Deusa</figcaption>
    </figure>
    <div class="submundo__panel">
      <a class="submundo__btn submundo__btn--link" href="../../assets/submundo/hecate_relic.png" download="hecate_relic.png">
        Baixar Relíquia da Deusa
      </a>
      <form id="hecate-form">
        <label class="submundo__label" for="hecate-pass">Código da tocha</label>
        <input class="submundo__input" id="hecate-pass" autocomplete="off" spellcheck="false" />
        <button class="submundo__btn" type="submit">Acender a encruzilhada</button>
        <p class="submundo__status" id="hecate-status" role="status"></p>
      </form>
    </div>
  </main>
  <script type="module" src="../../js/submundo/hecate.js"></script>
</body>
</html>
