<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Visualizar inscrição do Grimório | Fundamentos de Jogos Digitais." />
  <meta name="theme-color" content="#0d0a10" />
  <title>Inscrição | Grimório Pessoal</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var next = './grimorio.html';
      if (id) {
        var q = new URLSearchParams();
        q.set('id', id);
        if (params.get('edit') === '1') {
          next = './grimorio-editar.html?' + q.toString();
        } else {
          next = './grimorio.html?' + q.toString();
        }
      } else if (params.get('edit') === '1') {
        next = './grimorio-editar.html';
      }
      window.location.replace(next);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=./grimorio.html" />
</head>
<body class="app-shell-page">
  <p style="font-family: Cinzel, serif; color: #cfa759; padding: 2rem; text-align: center;">
    Abrindo o Grimório…
    <a href="./grimorio.html">Continuar</a>
  </p>
  <script type="module" src="../js/grimorio-nota.js"></script>
</body>
</html>
