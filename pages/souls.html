<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Almas Registradas | Fundamentos de Jogos Digitais" />
  <meta name="theme-color" content="#0d0a10" />
  <title>Almas Registradas | Fundamentos de Jogos Digitais</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/souls.css" />
</head>
<body>
  <div class="vignette" aria-hidden="true"></div>

  <header class="souls-header">
    <a class="btn-back" href="../pages/dashboard.html" aria-label="Voltar para o Salão dos Heróis">
      <span aria-hidden="true">←</span> Voltar ao Salão
    </a>

    <div class="souls-header__titles">
      <p class="souls-header__eyebrow">Painel Administrativo</p>
      <h1 class="souls-header__title">ALMAS <span class="accent">REGISTRADAS</span></h1>
    </div>

    <button class="btn-refresh" type="button" id="btn-refresh" aria-label="Atualizar listagem">
      Atualizar
    </button>
  </header>

  <div class="ornate-divider" aria-hidden="true">
    <span class="ornate-divider__line"></span>
    <span class="ornate-divider__gem">◆</span>
    <span class="ornate-divider__line"></span>
  </div>

  <main class="souls-main" aria-label="Lista de alunos cadastrados">
    <section class="summary" id="summary">
      <article class="summary-card">
        <p class="summary-card__label">Total de Almas</p>
        <p class="summary-card__value" id="sum-users">0</p>
      </article>
      <article class="summary-card">
        <p class="summary-card__label">Aulas Vistas (eventos)</p>
        <p class="summary-card__value" id="sum-views">0</p>
      </article>
      <article class="summary-card">
        <p class="summary-card__label">Aulas Concluídas</p>
        <p class="summary-card__value" id="sum-completed">0</p>
      </article>
      <article class="summary-card">
        <p class="summary-card__label">Conquistas</p>
        <p class="summary-card__value" id="sum-achievements">0</p>
      </article>
    </section>

    <div class="report-tabs" role="tablist" aria-label="Seções do relatório">
      <button class="report-tab is-active" id="tab-users" type="button" role="tab" aria-selected="true" aria-controls="report-users">Alunos</button>
      <button class="report-tab" id="tab-activities" type="button" role="tab" aria-selected="false" aria-controls="report-activities">Atividades</button>
    </div>

    <section class="report-panel" id="report-users" role="tabpanel" aria-labelledby="tab-users">
      <div class="souls-grid" id="souls-grid" aria-live="polite">
        <p class="loading">Consultando o submundo...</p>
      </div>
    </section>

    <section class="report-panel" id="report-activities" role="tabpanel" aria-labelledby="tab-activities" hidden>
      <div class="activities-list" id="activities-list" aria-live="polite">
        <p class="loading">Consultando atividades...</p>
      </div>
    </section>
  </main>

  <div class="api-warning" id="api-warning" hidden>
    <p id="api-warning-text"></p>
  </div>

  <script type="module" src="../js/souls.js"></script>
</body>
</html>
