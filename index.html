<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Fundamentos de Jogos Digitais — Plataforma gamificada de ensino de design de jogos." />
  <meta name="theme-color" content="#0a0908" />
  <title>Fundamentos de Jogos Digitais — Introdução</title>
  <link rel="icon" href="./assets/icons/favicon.png" type="image/png" sizes="64x64" />
  <link rel="icon" href="./assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./assets/icons/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" sizes="180x180" />

  <!-- Fonts: Cinzel (títulos/botões, inscrições clássicas) + Crimson Text (leitura) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/hades-tokens.css?v=20261021d" />
  <link rel="stylesheet" href="./css/hades-components.css?v=20261021d" />
  <link rel="stylesheet" href="./css/style.css?v=20261021d" />
  <script src="./js/devtools-guard.boot.js"></script>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('activeSession');
        var session = raw ? JSON.parse(raw) : null;
        if (session && session.token) {
          window.location.replace('./pages/dashboard.html');
          return;
        }
      } catch (e) {}
      window.location.replace('./pages/auth.html');
    })();
  </script>
</head>
<body class="game-screen">
  <script type="module" src="./js/main.js"></script>
</body>
</html>
