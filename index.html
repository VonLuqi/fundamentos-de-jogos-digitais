<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Fundamentos de Jogos Digitais — Plataforma gamificada de ensino de design de jogos." />
  <meta name="theme-color" content="#0a0908" />
  <title>Fundamentos de Jogos Digitais — Menu Principal</title>

  <!-- Fonts: Cinzel (títulos/botões, inscrições clássicas) + Crimson Text (leitura) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="game-screen">

  <!-- Vinheta escura nas bordas (profundidade de tela de menu) -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- Overlay de transição (fade para "carregar fase") -->
  <div class="screen-fade" aria-hidden="true"></div>

  <!-- HUD superior: título do jogo -->
  <header class="game-header">
    <h1 class="game-header__title">FUNDAMENTOS <span class="accent">DE</span> JOGOS DIGITAIS</h1>
    <p class="game-header__subtitle">// Seleção de Módulo</p>
  </header>

  <!-- Divisor ornamentado -->
  <div class="ornate-divider" aria-hidden="true">
    <span class="ornate-divider__line"></span>
    <span class="ornate-divider__gem">◆</span>
    <span class="ornate-divider__line"></span>
  </div>

  <!-- Layout principal em grid -->
  <main class="game-layout">

    <!-- ========== PAINEL ESQUERDO: STATUS DO JOGADOR (dinâmico via API) ========== -->
    <aside class="player-panel" id="player-panel" aria-label="Status do jogador">
      <!-- Retrato do jogador (moldura dupla dourada); ganha coroa/aura se admin -->
      <div class="player-portrait" id="player-portrait" role="img" aria-label="Retrato do jogador">
        <span class="player-portrait__crown" aria-hidden="true">&#9819;</span>
        <span class="player-portrait__glyph" id="player-glyph">&#9670;</span>
      </div>

      <!-- Identidade (preenchida pelo js/main.js com o usuário logado) -->
      <h2 class="player-panel__name" id="player-name">Carregando&hellip;</h2>
      <p class="player-panel__class" id="player-rank">&mdash;</p>

      <!-- Nível e Barra de XP -->
      <div class="player-stats">
        <div class="player-stats__level">
          <span class="player-stats__level-label">Nível</span>
          <span class="player-stats__level-value" id="player-level">&mdash;</span>
        </div>

        <div class="xp-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Experiência do jogador">
          <div class="xp-bar__fill" id="player-xp-fill" style="width: 0%;"></div>
          <span class="xp-bar__text" id="player-xp-text">&mdash; / &mdash; XP</span>
        </div>

        <!-- Estatísticas -->
        <dl class="player-stats__list">
          <div class="player-stats__item">
            <dt>Aulas Concluídas</dt>
            <dd id="player-lessons">&mdash;</dd>
          </div>
          <div class="player-stats__item">
            <dt>Conquistas</dt>
            <dd id="player-achievements">&mdash;</dd>
          </div>
        </dl>

        <!-- Atalho para o painel completo -->
        <a class="player-panel__link" href="./pages/dashboard.html">Ver Salão dos Heróis →</a>
      </div>
    </aside>

    <!-- ========== PAINEL CENTRAL: SELEÇÃO DE FASES ========== -->
    <section class="stage-select" aria-label="Seleção de aulas">
      <ul class="stage-select__list">

        <!-- CARD 1: DESBLOQUEADO E EM DESTAQUE -->
        <li>
          <button class="stage-card stage-card--featured" type="button" data-stage="aula1" data-unlocked="true">
            <span class="stage-card__number">01</span>
            <span class="stage-card__content">
              <span class="stage-card__title">A Regra do Jogo</span>
              <span class="stage-card__subtitle">O Framework MDA e Mecânicas</span>
            </span>
            <span class="stage-card__reward">
              <span class="stage-card__xp">+20 XP</span>
            </span>
          </button>
        </li>

        <!-- CARD 2: BLOQUEADO -->
        <li>
          <button class="stage-card" type="button" data-stage="aula-2" data-unlocked="false" disabled>
            <span class="stage-card__number">02</span>
            <span class="stage-card__content">
              <span class="stage-card__title">????????</span>
              <span class="stage-card__subtitle">Requisito: Concluir Aula Anterior</span>
            </span>
            <span class="stage-card__lock" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
          </button>
        </li>

        <!-- CARD 3: BLOQUEADO -->
        <li>
          <button class="stage-card" type="button" data-stage="aula-3" data-unlocked="false" disabled>
            <span class="stage-card__number">03</span>
            <span class="stage-card__content">
              <span class="stage-card__title">????????</span>
              <span class="stage-card__subtitle">Requisito: Concluir Aula Anterior</span>
            </span>
            <span class="stage-card__lock" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
          </button>
        </li>

      </ul>
    </section>

  </main>

  <!-- ========== BARRA INFERIOR: CONTROLES ========== -->
  <footer class="controls-bar" aria-label="Controles do jogo">
    <button class="controls-bar__btn" type="button" data-action="dashboard" aria-label="Ir para o Painel do Aluno (tecla P)">
      <span class="controls-bar__key">P</span>
      <span class="controls-bar__action">Painel do Herói</span>
    </button>
    <button class="controls-bar__btn" type="button" data-action="logout" aria-label="Encerrar a sessão atual (tecla L)">
      <span class="controls-bar__key">L</span>
      <span class="controls-bar__action">Encerrar Sessão</span>
    </button>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
